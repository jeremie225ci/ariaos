[greeter]
background=/usr/share/backgrounds/aria-greeter.png
user-background=false
transition-duration=0
theme-name=Adwaita-dark
icon-theme-name=AriaMono
cursor-theme-name=Adwaita
font-name=DejaVu Sans 11
indicators=~power;~clock
clock-format=%H:%M
position=50%,center 50%,76%
default-user-image=/usr/share/pixmaps/aria-logo.png
hide-user-image=false
round-user-image=true
highlight-logged-user=true
screensaver-timeout=0
